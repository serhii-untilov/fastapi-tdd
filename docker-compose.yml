name: fastapi-development

networks:
  dev-network:
    driver: bridge

services:

  dev-db:
    container_name: dev-db
    image: postgres:16.14-alpine3.24
    restart: always
    env_file:
      - ./.env
    ports:
      - "5443:5432"
    volumes:
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      - dev-network

